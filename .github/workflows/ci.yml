name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Installer
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Types
        run: mypy src tests scripts
      - name: Tests et couverture
        run: pytest --cov=fec_check --cov-report=term-missing
      - name: FEC fictifs reproductibles
        run: |
          python scripts/generer_fec_fictifs.py tests/fixtures
          git diff --exit-code tests/fixtures

  skill:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire l'archive de la skill
        run: python scripts/construire_skill.py dist/fec-check-skill.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fec-check-skill
          path: dist/fec-check-skill.zip
