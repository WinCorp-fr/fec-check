name: Release

# Déclenché par un tag vX.Y.Z : publie l'archive de la skill sur la page Releases.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${VERSION}\"" pyproject.toml
          grep -q "__version__ = \"${VERSION}\"" src/fec_check/__init__.py
      - name: Tests
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Construire l'archive de la skill
        run: python scripts/construire_skill.py dist/fec-check-skill.zip
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/fec-check-skill.zip \
            --title "fec-check $GITHUB_REF_NAME" \
            --notes-file CHANGELOG.md
