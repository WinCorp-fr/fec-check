name: Release

# Déclenché quand une release est publiée sur GitHub (bouton « Publish release »,
# avec un tag vX.Y.Z) : vérifie la version, relance les tests, construit
# l'archive de la skill et l'attache à la release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  archive-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          grep -q "^version = \"${VERSION}\"" pyproject.toml
          grep -q "__version__ = \"${VERSION}\"" src/fec_check/__init__.py
      - name: Tests
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Construire l'archive de la skill
        run: python scripts/construire_skill.py dist/fec-check-skill.zip
      - name: Attacher l'archive à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/fec-check-skill.zip --clobber
